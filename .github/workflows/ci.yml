name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.20.2

jobs:
  quality:
    name: Quality, tests, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run repository verification
        run: npm run verify
      - name: Run tests with coverage artifacts
        run: npm run test:coverage
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-and-coverage-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  local-integration:
    name: Local migration and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Start isolated local services
        run: npm run stack:up
      - name: Prepare local configuration
        run: cp .env.example .env
      - name: Validate migration plan
        run: npm run db:dry-run
      - name: Apply migrations
        run: npm run db:migrate
      - name: Check database and stack health
        run: |
          npm run db:health
          npm run stack:check
      - name: Run API integration test
        run: npm run test:integration
      - name: Capture local service logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f docker/compose.yml logs --no-color > artifacts/local-stack.log
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-integration-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local services
        if: always()
        run: npm run stack:down

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: zricethezav/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  deferred-scanners:
    name: Deferred scanner gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate SAST placeholder ownership
        run: node scripts/check-deferred-security.mjs --tool=sast
      - name: Validate container scanner placeholder ownership
        run: node scripts/check-deferred-security.mjs --tool=container
      - name: Validate infrastructure scanner placeholder ownership
        run: node scripts/check-deferred-security.mjs --tool=iac
