include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq"
}

queues-storage {
  enabled = true
  path = "/data/queues.conf"
}

aws {
  region = "us-east-1"
  accountId = "000000000000"
}

queues {
  demo-jobs {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 5 seconds
  }
  dead-letter {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
  media-processing {
    defaultVisibilityTimeout = 30 seconds
